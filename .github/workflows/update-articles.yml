name: Update Articles

on:
  schedule:
    - cron: '0 20 * * *'  # 日本時間 5:00 (UTC 20:00) / Deploy より前に実行
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: 'package.json'
          check-latest: true
      - name: Fetch latest articles
        run: make articles/fetch
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          commit-message: 'chore: update articles.data.json'
          title: 'chore: 記事データ (articles.data.json) を更新'
          body: |
            はてなブログ / Zenn / 企業ブログ の記事データとはてなブックマーク数を再取得しました。

            この PR は `update-articles` ワークフローが自動生成しています。
          branch: chore/update-articles
          delete-branch: true
          add-paths: |
            frontend/src/domains/articles/articles.data.json
